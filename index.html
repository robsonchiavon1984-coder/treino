<body>
<style>
#boot{position:fixed;inset:0;z-index:999;background:#0C0C0E;color:#F4F4F5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
#boot .m{width:64px;height:64px;border-radius:18px;background:#FF6A2B;display:grid;place-items:center}
#boot .t{font-size:19px;font-weight:650;letter-spacing:-.02em}
#boot .b{width:140px;height:3px;border-radius:99px;background:#26262B;overflow:hidden}
#boot .b i{display:block;height:100%;width:40%;border-radius:99px;background:#FF6A2B;animation:bootbar 1.1s ease-in-out infinite}
@keyframes bootbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
#boot .s{font-size:13px;color:#8A8A93;margin:0;max-width:280px}
#boot .r{display:none;padding:11px 18px;border-radius:13px;background:#FF6A2B;color:#1B0A02;border:0;font-weight:600;font-size:15px}
</style>
<div id="boot" role="status" aria-live="polite">
  <div class="m"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1B0A02" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></div>
  <div class="t">Forja de Treino</div><div class="b"><i></i></div>
  <p class="s" id="boot-s">Preparando seus treinos…</p>
  <button class="r" id="boot-r" onclick="location.reload()">Tentar de novo</button>
</div>
<script>setTimeout(function(){var b=document.getElementById('boot');if(!b||b.classList.contains('fim'))return;document.getElementById('boot-s').textContent='Está demorando mais que o normal. Verifique a conexão.';document.getElementById('boot-r').style.display='inline-block';b.querySelector('.b').style.display='none';},25000);</script>
<div id="app">
  <aside class="rail">
    <div class="brand"><div class="logo"><svg class="ic" viewBox="0 0 24 24" style="stroke-width:2.4"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></div><b>Forja de Treino</b></div>

</div>
